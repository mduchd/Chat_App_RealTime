server.address=127.0.0.1
server.port=8080
server.forward-headers-strategy=none
chat.session.cookie-secure=false
chat.session.cookie-same-site=Strict
chat.friends.accent-insensitive-search=true
chat.storage.web-features=false
chat.storage.direct-only-blocking=true

spring.datasource.url=jdbc:h2:file:${user.home}/.chatspace/chat;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration,classpath:db/swing-local
